<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="ドット絵のレトロ野球＋選手育成。ペナントとサクセスも遊べる。"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style></head><body>
<title>ミオスタジアム</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* layout: retro 8-bit ballpark — menu screens and game screen share one phone column; pixel scoreboard, 240x320 canvas, chunky pad */
:root{
  --bg:#0b1030; --panel:#141b4a; --line:#3a4590; --ink:#f4f1e2; --mute:#9aa3d6;
  --yel:#ffd23f; --red:#ff5a4e; --grn:#3ddc84; --cyan:#4fd6ff; --pad:#232d6e;
  --pix:"DotGothic16","Hiragino Sans","Noto Sans JP",monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--pix);font-size:15px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:10px 28px;display:flex;flex-direction:column;gap:8px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}

.mini{background:var(--pad);border:2px solid var(--line);padding:4px 10px;font-size:13px}
button{font-family:var(--pix);color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--yel);outline-offset:1px}
#game{display:flex;flex-direction:column;gap:6px}
.board{background:#07081a;border:3px solid var(--line);padding:5px 7px;font-variant-numeric:tabular-nums;overflow-x:auto}
.board table{border-collapse:collapse;width:100%;font-size:13px}
.board th,.board td{padding:1px 3px;text-align:center;min-width:1.2em}
.board th{color:var(--mute);font-weight:400}
.board td.t{text-align:left;white-space:nowrap}
.board td.r{color:var(--yel)}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.cnt span{display:inline-block;width:9px;height:9px;border-radius:50%;background:#333a66;margin-left:2px}
.cnt .b.on{background:var(--grn)}.cnt .s.on{background:var(--yel)}.cnt .o.on{background:var(--red)}
.bases{position:relative;width:34px;height:24px;flex:none}
.bases i{position:absolute;width:9px;height:9px;background:#333a66;transform:rotate(45deg)}
.bases i.on{background:var(--yel)}
.info{font-size:12px;color:var(--mute);line-height:1.6;text-align:center;min-height:2.6em}
.info b{color:var(--ink);font-weight:400}
.call{font-size:14px;text-align:center;min-height:1.4em;color:var(--yel)}
.stage{position:relative}
canvas{width:100%;aspect-ratio:240/320;display:block;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--line);background:#1d6b2f;touch-action:none}
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(8,10,30,.84);text-align:center;padding:16px;overflow:auto}
.over h2{font-size:1.8rem;margin:0;color:var(--yel);font-weight:400;letter-spacing:.05em;text-shadow:3px 3px 0 #b3261e}
.over p{margin:0;line-height:1.6}
.pad{display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:7px;flex-wrap:wrap}
.k{flex:1;min-width:0;padding:11px 4px;background:var(--pad);border:3px solid var(--line);border-bottom-width:6px;font-size:14px}
.k:active{border-bottom-width:3px;transform:translateY(3px)}
.k.on{background:#4a3d0c;border-color:var(--yel);color:var(--yel)}
.k.big{background:var(--red);border-color:#8c2019;font-size:21px;padding-block:17px}
.k.sm{flex:0 1 auto;padding-inline:10px;font-size:13px}
.k:disabled{opacity:.35}
.help{font-size:12px;color:var(--mute);line-height:1.7}
/* menu */
#menu{display:flex;flex-direction:column;gap:10px}
.hero{text-align:center;padding-block:14px 6px}
.hero h1{margin:0;font-weight:400;font-size:2.3rem;color:var(--yel);letter-spacing:.06em;text-shadow:4px 4px 0 #b3261e}
.hero p{margin:.3em 0 0;color:var(--mute);font-size:13px}
.card{background:var(--panel);border:3px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-weight:400;font-size:15px;color:var(--yel)}
.lbl{font-size:12px;color:var(--mute);letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.opt{padding:10px 6px;background:var(--pad);border:3px solid var(--line);font-size:14px;text-align:center;min-width:0}
.opt.on{border-color:var(--yel);color:var(--yel);background:#2b2a3e}
.opt small{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.opt:disabled{opacity:.35}
.go{padding:14px;background:var(--red);border:3px solid #8c2019;border-bottom-width:6px;font-size:19px}

.rS{background:#ff6ad5}.rA{background:#ff5a4e}.rB{background:#ff9a3c}.rC{background:#ffd23f}.rD{background:#c6e84a}.rE{background:#3ddc84}.rF{background:#4fb3ff}.rG{background:#8a90b8}
.tbl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.tbl th{color:var(--mute);font-weight:400;text-align:center;padding:3px 2px;border-bottom:1px solid var(--line)}
.tbl td{text-align:center;padding:4px 2px;border-bottom:1px dashed #2a3370}
.tbl td.l{text-align:left;white-space:nowrap}
.scroll{overflow-x:auto}
.sp{display:inline-block;font-size:11px;padding:0 4px;margin:1px;border:1px solid var(--cyan);color:var(--cyan)}
.mine{color:var(--yel)}
.msg{background:#0f1540;border:3px solid var(--line);padding:10px;line-height:1.7;font-size:14px}
.msg .who{color:var(--cyan)}
.bar{height:10px;background:#07081a;border:2px solid var(--line)}

.exp div{background:#0f1540;border:2px solid var(--line);padding:3px 0;font-variant-numeric:tabular-nums}
.exp b{display:block;font-weight:400;font-size:14px;color:var(--yel)}
.ab{display:grid;grid-template-columns:5em auto 1fr auto;gap:6px;align-items:center;font-size:13px}
.ab .cost{font-size:11px;color:var(--mute);text-align:right}
.plus{padding:6px 10px;background:var(--pad);border:2px solid var(--line);font-size:13px}
.plus:disabled{opacity:.3}
input[type=text]{width:100%;padding:10px;background:#07081a;border:3px solid var(--line);color:var(--ink);font-family:var(--pix);font-size:16px}
@media (prefers-reduced-motion:reduce){.k:active{transform:none}}
</style>

<div class="wrap">
  <div class="topbar"><span class="logo">ミオスタジアム</span><span class="row" style="flex-wrap:nowrap"><a class="mini" href="../../index.html" style="color:var(--ink);text-decoration:none">お店へ</a><button class="mini" id="snd">音 ON</button></span></div>
  <section id="menu"></section>
  <section id="game" hidden>
    <div class="board" id="board"></div>
    <div class="status">
      <div class="cnt">B<span class="b"></span><span class="b"></span><span class="b"></span> S<span class="s"></span><span class="s"></span> O<span class="o"></span><span class="o"></span></div>
      <div id="inn">1回表</div>
      <div class="bases"><i style="left:12px;top:0"></i><i style="left:23px;top:11px"></i><i style="left:1px;top:11px"></i></div>

    </div>
    <div class="call" id="call"></div>
    <div class="pad" id="pad"></div>
  </section>
</div>

<script>
// ================= 共通 =================
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const now=()=>performance.now();
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const RK=v=>v>=90?"S":v>=80?"A":v>=70?"B":v>=60?"C":v>=50?"D":v>=40?"E":v>=20?"F":"G";
const rk=v=>`<span class="rk r${RK(v)}">${RK(v)}</span>`;
const has=(o,s)=>!!(o&&o.sp&&o.sp.includes(s));
const KEY="mio-stadium-v2";
let D=store.get(KEY,null);
if(!D)D={rec:{w:0,l:0,d:0},mine:[],mods:{},pen:null,suc:null,mute:false,easy:true};
const save=()=>store.set(KEY,D);

// ================= データ =================
// 野手: 名前,守備位置,弾道,ミート,パワー,走力,肩力,守備力,特殊能力(/区切り)
// 投手: 名前,球速,コントロール,スタミナ,変化球(名前+Lv),特殊能力
const BASE=[
 {n:"ミオキャッツ",ab:"キャ",c:"#e94f64",c2:"#fff1ee",ear:"cat",
  bat:["ネコタ,中,2,72,40,86,62,70,盗塁◎","ミケノ,二,2,68,45,72,55,72,選球眼","トラオ,遊,3,76,62,64,70,68,チャンス◎","クロマル,一,4,58,92,40,55,48,パワーヒッター","シャム,三,3,62,72,48,68,58,","タマキ,右,2,60,52,62,74,60,","ハチワレ,左,2,56,46,70,52,56,内野安打○","サビ,捕,2,50,48,38,72,62,","ソマリ,DH,3,64,58,56,50,40,アベレージ"],
  pit:["ツメトギ,149,64,72,スライダー4/フォーク3,奪三振","ニクキュウ,153,58,30,フォーク5,ノビ◎"]},
 {n:"パグドッグス",ab:"パグ",c:"#d9a441",c2:"#fffaf0",ear:"dog",
  bat:["パグヤマ,中,2,70,34,88,60,72,盗塁◎","シバタ,二,2,70,42,72,58,70,","ドーベル,三,3,74,66,58,70,64,チャンス◎","ブルドグ,一,4,56,95,36,52,46,パワーヒッター","コーギ,左,3,62,68,52,60,56,","ポメラ,遊,2,62,40,78,66,74,内野安打○","テリア,右,2,58,48,64,70,58,","ダックス,捕,1,52,42,40,74,64,","ビーグル,DH,3,64,60,50,50,40,選球眼"],
  pit:["ワンダ,145,74,80,カーブ4/シュート3/チェンジアップ3,重い球","ハスキー,150,62,32,スライダー5,ピンチ◎"]},
 {n:"灯守ランタンズ",ab:"ラン",c:"#4f8cff",c2:"#f0f5ff",ear:"flame",
  bat:["ヒムロ,遊,2,74,38,82,68,76,盗塁◎","カガリ,中,2,70,44,74,62,72,","トモシ,二,3,78,58,62,60,66,アベレージ","ホムラ,一,4,60,90,42,56,50,パワーヒッター","ルシア,右,3,66,70,56,76,62,チャンス◎","アカリ,三,3,60,64,50,70,58,","ヨミ,左,2,58,50,66,56,56,","ススキ,捕,2,52,46,40,78,66,","ロウソ,DH,3,62,62,48,50,40,"],
  pit:["レオン,152,66,76,スライダー4/カットボール3/フォーク2,ノビ◎","ノア,148,70,30,シンカー5,キレ◎"]},
 {n:"銀河スターズ",ab:"スタ",c:"#b06cff",c2:"#f6f0ff",ear:"star",
  bat:["スバル,中,2,72,36,86,64,74,盗塁◎","ベガ,遊,2,68,44,76,68,72,","アルタ,三,3,76,64,58,70,62,チャンス◎","シリウス,一,4,58,94,38,52,48,パワーヒッター","リゲル,右,3,64,70,52,72,60,","カペラ,二,2,62,46,66,58,64,選球眼","デネブ,左,2,58,50,64,56,58,","ミラ,捕,2,50,48,36,74,64,","ポラリス,DH,3,66,58,50,50,40,アベレージ"],
  pit:["ギンガ,147,72,74,カーブ5/フォーク3,キレ◎","コメット,155,54,28,スライダー4,奪三振"]},
];
const PITCHES={ストレート:{s:1,x:0,y:0},スライダー:{s:.88,x:15,y:2},カーブ:{s:.78,x:10,y:13},フォーク:{s:.88,x:0,y:15},シュート:{s:.9,x:-12,y:3},シンカー:{s:.86,x:-10,y:10},チェンジアップ:{s:.8,x:-3,y:8},カットボール:{s:.95,x:6,y:1}};
const POSNAME={投:"ピッチャー",捕:"キャッチャー",一:"ファースト",二:"セカンド",三:"サード",遊:"ショート",左:"レフト",中:"センター",右:"ライト",DH:"DH"};
function parseBat(r){const a=r.split(",");return {n:a[0],pos:a[1],traj:+a[2],meet:+a[3],pow:+a[4],spd:+a[5],arm:+a[6],def:+a[7],sp:a[8]?a[8].split("/"):[]}}
function parsePit(r){const a=r.split(",");return {n:a[0],kmh:+a[1],ctl:+a[2],sta:+a[3],br:a[4].split("/").map(s=>{const m=s.match(/(\D+)(\d)/);return {t:m[1],lv:+m[2]}}),sp:a[5]?a[5].split("/"):[]}}
function teamData(i){
  const b=BASE[i],t={i,n:b.n,ab:b.ab,c:b.c,c2:b.c2,ear:b.ear,bat:b.bat.map(parseBat),pit:b.pit.map(parsePit)};
  const m=D.mods[i];
  if(m){for(const s in m.bat||{})t.bat[s]={...m.bat[s],mine:true};for(const s in m.pit||{})t.pit[s]={...m.pit[s],mine:true}}
  return t;
}
function batOvr(b){return (b.meet+b.pow+b.spd+b.arm+b.def)/5+(b.traj-2)*2+(b.sp?b.sp.length*3:0)}
function pitOvr(p){return (clamp((p.kmh-120)/40*100,0,100)+p.ctl+p.sta+Math.min(100,p.br.reduce((a,b)=>a+b.lv,0)*8))/4+(p.sp?p.sp.length*3:0)}

// ================= 試合エンジン =================
const ZONE={x0:92,x1:148,y0:188,y1:250};
const inZone=(x,y)=>x>=ZONE.x0-2.5&&x<=ZONE.x1+2.5&&y>=ZONE.y0-2.5&&y<=ZONE.y1+2.5;
let G=null;
const staMax=p=>40+p.sta*.9;
function newG(away,home,inns,me){
  const T=[teamData(away),teamData(home)].map(t=>({...t,cur:0,sta:t.pit.map(staMax),stMax:t.pit.map(staMax),used:[true,false]}));
  G={T,inns,inning:1,half:0,outs:0,balls:0,strikes:0,bases:[null,null,null],line:[[0],[]],R:[0,0],H:[0,0],E:[0,0],ord:[0,0],
     st:T.map(t=>t.bat.map(()=>({ab:0,h:0,hr:0,rbi:0,k:0,bb:0}))),me,lastKmh:[0,0],over:false,steal:null};
}
const fSide=()=>1-G.half;
const curBatK=()=>G.ord[G.half]%9;
const curBat=()=>G.T[G.half].bat[curBatK()];
const curPit=()=>{const t=G.T[fSide()];return t.pit[t.cur]};
const staPct=(side=fSide())=>{const t=G.T[side];return t.sta[t.cur]/t.stMax[t.cur]};
const risp=()=>!!(G.bases[1]||G.bases[2]);
function catcherOf(t){return t.bat.find(b=>b.pos==="捕")||{arm:60,def:60}}
function fielderStats(t,pos){if(pos==="投")return {def:55,arm:60};return t.bat.find(b=>b.pos===pos)||{def:55,arm:55}}

function effPitch(){const p=curPit(),s=staPct();let kmh=p.kmh,ctl=p.ctl;if(s<.3){kmh*=.96;ctl-=12}if(s<.12){kmh*=.96;ctl-=12}return {kmh,ctl}}
function makePitch(type,tx,ty){
  const p=curPit(),e=effPitch(),br=p.br.find(b=>b.t===type),lv=br?br.lv:0,pd=PITCHES[type];
  const k=type==="ストレート"?1:lv/5;
  const kmh=Math.round(e.kmh*pd.s*rnd(.985,1.01));
  const sg=(100-e.ctl)/14+1;
  const t=G.T[fSide()];t.sta[t.cur]=Math.max(0,t.sta[t.cur]-(type==="ストレート"?1:1.2));
  const change=G.lastKmh[fSide()]?Math.abs(kmh-G.lastKmh[fSide()]):0;G.lastKmh[fSide()]=kmh;
  return {type,lv,kmh,fx:tx+gauss()*sg,fy:ty+gauss()*sg*.9,bx:pd.x*k,by:pd.y*k,dur:90000/kmh,change,sx:120,sy:106};
}
function scatterOf(){return (100-effPitch().ctl)/14+1}
function cpuPickPitch(){
  const p=curPit(),opts=[["ストレート",4],...p.br.map(b=>[b.t,1.4+b.lv*.3])];
  let tot=opts.reduce((a,b)=>a+b[1],0),r=Math.random()*tot,type=opts[0][0];
  for(const o of opts){if((r-=o[1])<0){type=o[0];break}}
  let zp=.54;if(G.strikes===2&&G.balls<3)zp=.4;if(G.balls>=2&&G.strikes<2)zp=.74;if(G.balls===3)zp=.86;
  let tx,ty;
  if(Math.random()<zp-.06){tx=pick([97,104,120,136,143])+rnd(-3,3);ty=pick([193,205,219,233,245])+rnd(-3,3)}
  else{const q=Math.random();
    if(q<.35){tx=rnd(74,86);ty=rnd(192,248)}else if(q<.7){tx=rnd(154,166);ty=rnd(192,248)}
    else if(q<.9){tx=rnd(98,142);ty=rnd(256,268)}else{tx=rnd(98,142);ty=rnd(170,182)}}
  return {type,tx,ty};
}
function cursorR(b){const rx=9+b.meet*.09*(has(b,"アベレージ")?1.12:1);return {rx,ry:rx*.8}}
function cpuSwing(P,bat){
  const z=inZone(P.fx,P.fy),pit=curPit();let sw;
  if(z){sw=.68;if(G.balls===0&&G.strikes===0)sw=.45;if(G.strikes===2)sw=.9;if(G.balls===3&&G.strikes<2)sw=.45}
  else{sw=.22-(has(bat,"選球眼")?.1:0)+(G.strikes===2?.12:0)+(P.by>8?.08:0);if(G.balls===3)sw-=.1}
  if(Math.random()>=sw)return null;
  const straight=P.type==="ストレート";
  let e=6.2+Math.max(0,P.kmh-135)*.17+P.lv*.8-(bat.meet-50)*.07;
  if(straight&&has(pit,"ノビ◎"))e+=1.6;if(!straight&&has(pit,"キレ◎"))e+=1.6;
  if(G.strikes===2&&has(pit,"奪三振"))e+=1.6;if(risp()&&has(pit,"ピンチ◎"))e+=1.6;
  if(!z)e+=2.2;
  const edge=Math.min(Math.abs(P.fx-ZONE.x0),Math.abs(ZONE.x1-P.fx),Math.abs(P.fy-ZONE.y0),Math.abs(ZONE.y1-P.fy));if(edge<6)e+=1.2;
  if(P.change>18)e+=1.8;
  e=Math.max(2,e);
  const ts=62+(P.change>18?30:0)+P.lv*3-(bat.meet-50)*.4;
  return {cx:P.fx+gauss()*e,cy:P.fy+gauss()*e*.9+1.5,dt:gauss()*ts};
}
function hitBall(P,bat,cur,dt,bunt){
  const {rx,ry}=cursorR(bat);
  const dn=Math.hypot((P.fx-cur.cx)/rx,(P.fy-cur.cy)/ry);
  if(bunt){if(dn>1.4)return null;if(Math.random()<.22)return {foul:true,bunt:true,LA:0};return {bunt:true,q:.2}}
  if(dn>1.12||Math.abs(dt)>150)return null;
  if((dn>.78||Math.abs(dt)>105)&&Math.random()<.55)return {foul:true,LA:rnd(-10,70)};
  let q=clamp((1-dn*.72)*(1-Math.pow(Math.abs(dt)/150,1.6)),0,1);
  const sweet=dn<.28&&Math.abs(dt)<35;if(sweet)q=Math.min(1,q+.08);
  if(has(curPit(),"重い球"))q*=.93;
  if(risp()&&has(bat,"チャンス◎"))q=Math.min(1,q+.06);
  const ang=-dt/110*44+rnd(-6,6)+(P.fx-120)/28*9;
  const off=(cur.cy-P.fy)/ry;
  const LA=8+(bat.traj-2)*6+off*34+rnd(-7,7)-(1-q)*6;
  if(Math.abs(ang)>45)return {foul:true,LA};

let lt=now();
function loop(){
  const t=now(),dt=Math.min(.05,(t-lt)/1000);lt=t;
  if(G&&!$("#game").hidden){
    if(G.half===G.me&&!drag&&!D.easy){const sp=110*dt;if(keys.ArrowLeft)cur.cx-=sp;if(keys.ArrowRight)cur.cx+=sp;if(keys.ArrowUp)cur.cy-=sp;if(keys.ArrowDown)cur.cy+=sp;cur.cx=clamp(cur.cx,80,160);cur.cy=clamp(cur.cy,176,262)}
    if(phase==="pitch"&&P){
      const u=(t-P.start)/P.dur;
      if(!P.thrown&&t>=P.start){P.thrown=true;SFX.throw()}
      if(G.half===G.me){
        if(D.easy&&u>.3&&!P.done){const k=Math.min(1,dt*10);cur.cx+=(P.fx+P.ex-cur.cx)*k;cur.cy+=(P.fy+P.ey-cur.cy)*k}
        if(bunt&&u>=1&&!P.done){P.done=true;const h=hitBall(P,curBat(),cur,0,true);if(h){P.hit=!h.foul;handleHit(h)}else pitchEnd(inZone(P.fx,P.fy)?"strike":"ball")}
        if(!P.done&&u>=1.1){P.done=true;pitchEnd(P.swung?"swing":(inZone(P.fx,P.fy)?"strike":"ball"))}
        if(canSteal()===false&&G.steal==null){}
      }else if(!P.done&&u>=1){
        P.done=true;const s=P.cpu;
        if(!s)pitchEnd(inZone(P.fx,P.fy)?"strike":"ball");
        else{cpuSwingT=t-60;const h=hitBall(P,curBat(),{cx:s.cx,cy:s.cy},s.dt,false);if(h){P.hit=!h.foul;handleHit(h)}else pitchEnd("swing")}
      }
    }
    if(phase==="field"&&A)drawTopView(t);else drawBatView(t);
  }else drawTitleBg(t);
  // 花火
  parts=parts.filter(p=>(p.life-=dt)>0);parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=40*dt;R(p.x,p.y,2,2,p.col)});
  if(flashO&&t-flashO.t<1300){
    const f=flashO,s=f.big?20:16,a=Math.min(1,(t-f.t)/120);
    c.font=`${s}px DotGothic16,monospace`;c.textAlign="center";
    const w=c.measureText(f.text).width,sc=Math.min(1,226/w);c.save();c.translate(120,158);c.scale(sc*(0.8+a*.2),sc*(0.8+a*.2));
    c.fillStyle="#000";c.fillText(f.text,2,2);c.fillStyle="#b3261e";c.fillText(f.text,1,1);c.fillStyle=f.color||"#fff";c.fillText(f.text,0,0);c.restore();
  }
  requestAnimationFrame(loop);
}

function penRecord(res,my,th){
  const p=D.pen,op=p.sched[p.g],o=[0,1,2,3].filter(i=>i!==p.team&&i!==op);
  const T=p.tbl;
  if(res==="win"){T[p.team].w++;T[op].l++}else if(res==="lose"){T[p.team].l++;T[op].w++}else{T[p.team].d++;T[op].d++}
  p.log.push(`第${p.g+1}戦 vs ${BASE[op].ab} ${my}-${th} ${res==="win"?"○":res==="lose"?"●":"△"}`);
  const s=simGame(o[0],o[1],p.inns),a=s.R[0],b=s.R[1];
  if(a>b){T[o[0]].w++;T[o[1]].l++}else if(a<b){T[o[1]].w++;T[o[0]].l++}else{T[o[0]].d++;T[o[1]].d++}
  p.g++;
  return `<p class="help">他会場：${BASE[o[0]].ab} ${a}-${b} ${BASE[o[1]].ab}</p>`;
}

  $("#bk").onclick=mainMenu;
}
function gainExp(s,e,mul){const got={};for(const k in e){const v=Math.round(e[k]*mul);s.exp[k]+=v;got[k]=v}return Object.entries(got).map(([k,v])=>`${EXPN[k]}+${v}`).join(" ")}
function sucTrain(k){
  const s=D.suc;let msg="";
  if(k==="rest"){s.hp=Math.min(100,s.hp+45);if(Math.random()<.3)s.mood=Math.min(4,s.mood+1);msg=`ゆっくり休んで体力が回復した。`}
  else if(k==="mio"){s.hp=Math.min(100,s.hp+15);s.mood=Math.min(4,s.mood+1);const g=gainExp(s,{精:5},1);
    msg=`<span class="who">ミオ</span>「${pick(["最近フォームが安定してきたね！データでも出てるよ","プロテスト、絶対いけるって信じてるから！","たまには息抜きも大事だよ。はい、はちみつレモン！","ライバルのカゲトラくん、すごく練習してるみたい…負けないでね"])}」<br>やる気が上がった！（${g}）`}
  else{
    const t=[...TR_B,...TR_P].find(x=>x.k===k&&(s.type==="野手"?TR_B:TR_P).includes(x));
    if(s.hp<25&&Math.random()<.3){s.inj=2;s.mood=Math.max(0,s.mood-1);s.hp=Math.max(0,s.hp-10);msg=`<span style="color:var(--red)">練習中にケガをしてしまった…（2週間の治療）</span><br><span class="who">ミオ</span>「だから休んでって言ったのに…！」`}
    else{
      const lv=Math.min(5,1+Math.floor((s.cnt[k]||0)/3));s.cnt[k]=(s.cnt[k]||0)+1;
      const g=gainExp(s,t.e,MOODM[s.mood]*(1+(lv-1)*.15));s.hp=Math.max(0,s.hp-t.hp);
      msg=`${t.n}練習をした！（${g}）`;
      if(Math.min(5,1+Math.floor(s.cnt[k]/3))>lv)msg+=`<br><span style="color:var(--yel)">${t.n}練習がLv${lv+1}になった！</span>`;
    }
  }
  s.msg=msg;
  // イベント
  if(!s.inj&&Math.random()<.38)sucEvent(s);
  sucAdvance();
}
function sucEvent(s){
  const ov=sucOvr(s);
  const ev=pick([
    ()=>{s.hp=Math.min(100,s.hp+15);s.msg+=`<br><br><span class="who">ミオ</span>「差し入れ持ってきたよ！」<br>体力が回復した。`},
    ()=>{const g=gainExp(s,{技:12},1);s.mood=Math.min(4,s.mood+1);s.msg+=`<br><br><span class="who">ミオ</span>「昨日の練習、動画で見直したの。ここを直すともっと伸びるよ！」<br>（${g}）やる気アップ`},
    ()=>{const g=gainExp(s,{筋:6,敏:6,技:6,精:6},1);s.hp=Math.max(0,s.hp-12);s.msg+=`<br><br><span class="who">ゴリ監督</span>「今日は特別メニューだ！ついてこい！」<br>（${g}）`},
    ()=>{s.hp=Math.min(100,s.hp+12);s.msg+=`<br><br>雨で練習が早めに終わった。体力が少し回復。`},
    ()=>{s.msg+=`<br><br><span class="who">カゲトラ</span>「おい${s.pl.n}！オレと勝負しろ！」`;s.evt={ch:[["勝負を受ける",x=>{if(Math.random()<.3+ov/150){const g=gainExp(x,{筋:14,精:14},1);x.mood=Math.min(4,x.mood+1);x.msg=`カゲトラとの勝負に勝った！<br><span class="who">カゲトラ</span>「…次は負けねぇ」（${g}）`}else{const g=gainExp(x,{精:8},1);x.mood=Math.max(0,x.mood-1);x.msg=`カゲトラに負けてしまった…<br>悔しさをバネにしよう（${g}）`}}],["今日はやめておく",x=>{x.msg=`<span class="who">カゲトラ</span>「ふん、逃げるのか」`}]]}},
    ()=>{s.msg+=`<br><br>夜、グラウンドに明かりがついている…自主練する？`;s.evt={ch:[["自主練する",x=>{const g=gainExp(x,x.type==="野手"?{技:10,筋:4}:{変:6,技:8},1);x.hp=Math.max(0,x.hp-12);x.msg=`夜遅くまで自主練した！（${g}）`}],["しっかり寝る",x=>{x.hp=Math.min(100,x.hp+8);x.msg=`ぐっすり眠った。体力が少し回復。`}]]}},
    ()=>{s.msg+=`<br><br><span class="who">ミオ</span>「ねぇ、今度の休み、バッティングセンター行かない？」`;s.evt={ch:[["一緒に行く",x=>{x.mood=Math.min(4,x.mood+2);const g=gainExp(x,{技:6,精:8},1);x.msg=`<span class="who">ミオ</span>「楽しかった〜！また行こうね！」<br>やる気が大きく上がった（${g}）`}],["練習がある",x=>{const g=gainExp(x,{技:6},1);x.msg=`<span class="who">ミオ</span>「そっか、がんばってね」（${g}）`}]]}},
  ]);
  ev();
}
function sucAdvance(){
  const s=D.suc;s.turn++;
  if(Math.random()<.12&&s.mood>0&&!s.evt){s.mood--;}
  if(s.turn===TOURNEY&&!s.tour){s.tour=true;sucTourney(s)}
  save();sucView();
}
function sucTourney(s){
  const ov=sucOvr(s),names=["山吹工業","海風学園","桜ヶ丘高校","王者 帝都大付属"];let wins=0,log="";
  for(let r=0;r<4;r++){const p=clamp(.62+(ov-45)/70-r*.08,.15,.92);if(Math.random()<p){wins++;const my=ri(3,8),th=ri(0,my-1);log+=`${r+1}回戦 vs ${names[r]} ${my}-${th} 勝利！<br>`}else{const th=ri(3,8);log+=`${r+1}回戦 vs ${names[r]} ${ri(0,th-1)}-${th} 敗退…<br>`;break}}
  const g=gainExp(s,{筋:wins*8+6,敏:wins*8+6,技:wins*8+6,変:s.type==="投手"?wins*8+4:0,精:wins*10+6},1);
  s.mood=wins>=3?4:wins>=1?Math.max(s.mood,3):Math.max(0,s.mood-1);
  s.msg=`<b style="color:var(--yel)">夏の大会！</b><br>${log}${wins===4?`<span style="color:var(--yel)">優勝！！スカウトの注目を集めた！</span><br>`:""}（${g}）<br><span class="who">ミオ</span>「${wins>=3?"すごいよ！スカウトの人たち、みんな見てたよ！":"この夏の経験、絶対に次につながるから！"}」`;
}
function abCost(s,key){
  const p=s.pl,c=v=>Math.round(10+v*.35);
  if(s.type==="野手"){
    if(key==="traj")return p.traj>=4?null:{筋:40*p.traj};
    const v=p[key];if(v>=100)return null;
    return {meet:{技:c(v),筋:Math.round(c(v)*.5)},pow:{筋:c(v)},spd:{敏:c(v)},arm:{筋:Math.round(c(v)*.6),敏:Math.round(c(v)*.6)},def:{技:Math.round(c(v)*.6),敏:Math.round(c(v)*.6)}}[key];
  }
  if(key==="kmh")return p.kmh>=160?null:{筋:Math.round(12+(p.kmh-125)*1.1)};
  if(key==="ctl")return p.ctl>=100?null:{技:c(p.ctl),精:Math.round(c(p.ctl)*.4)};
  if(key==="sta")return p.sta>=100?null:{敏:Math.round(c(p.sta)*.6),精:Math.round(c(p.sta)*.6)};
  if(key.startsWith("br:")){const b=p.br.find(x=>x.t===key.slice(3));return b.lv>=7?null:{変:12+b.lv*8}}
  if(key.startsWith("new:"))return p.br.length>=3?null:{変:30};
}
const costTxt=c=>c?Object.entries(c).map(([k,v])=>`${EXPN[k]}${v}`).join(" "):"MAX";
const canPay=(s,c)=>c&&Object.entries(c).every(([k,v])=>s.exp[k]>=v);
const pay=(s,c)=>Object.entries(c).forEach(([k,v])=>s.exp[k]-=v);
function sucAbility(){
  const s=D.suc,p=s.pl;
  const row=(label,val,key,disp)=>{const cc=abCost(s,key);return `<div class="ab"><span>${label}</span><span>${disp}</span><span class="cost">${costTxt(cc)}</span><button class="plus" data-a="${key}" ${canPay(s,cc)?"":"disabled"}>＋</button></div>`};
  let rows="";
  if(s.type==="野手"){
    rows=row("弾道",p.traj,"traj",p.traj)+[["meet","ミート"],["pow","パワー"],["spd","走力"],["arm","肩力"],["def","守備力"]].map(([k,n])=>row(n,p[k],k,`${rk(p[k])} ${p[k]}`)).join("");
  }else{
    rows=row("球速",p.kmh,"kmh",`${p.kmh}km`)+row("コントロール",p.ctl,"ctl",`${rk(p.ctl)} ${p.ctl}`)+row("スタミナ",p.sta,"sta",`${rk(p.sta)} ${p.sta}`)+
      p.br.map(b=>row(b.t,b.lv,"br:"+b.t,`Lv${b.lv}`)).join("");
  }
  const spList=(s.type==="野手"?SP_B:SP_P);
  const newBr=Object.keys(PITCHES).filter(t=>t!=="ストレート"&&!(p.br||[]).some(b=>b.t===t));
  const spc={技:40,精:40};
  showMenu(`<div class="card"><h3>能力アップ　${p.n}</h3>
    <div class="exp">${EXPK.map(k=>`<div>${EXPN[k]}<b>${Math.floor(s.exp[k])}</b></div>`).join("")}</div>
    <div class="lbl">基本能力（＋で1段階アップ）</div>${rows}
    ${s.type==="投手"&&p.br.length<3?`<div class="lbl">新しい変化球を覚える（変化球30）</div><div class="grid2">${newBr.map(t=>`<button class="opt" data-n="${t}" ${canPay(s,{変:30})?"":"disabled"}>${t}</button>`).join("")}</div>`:""}
    <div class="lbl">特殊能力（技術40・精神40）</div>
    <div class="grid2">${spList.map(n=>`<button class="opt${p.sp.includes(n)?" on":""}" data-s="${n}" ${p.sp.includes(n)||!canPay(s,spc)?"disabled":""}>${n}<small>${SPDESC[n]}</small></button>`).join("")}</div>
    <button class="go" id="bk">練習に戻る</button></div>`);
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.a,cc=abCost(s,k);if(!canPay(s,cc))return;pay(s,cc);SFX.good();
    if(k==="traj")p.traj++;else if(k==="kmh")p.kmh+=2;else if(k.startsWith("br:"))p.br.find(x=>x.t===k.slice(3)).lv++;else p[k]=Math.min(100,p[k]+5);
    save();sucAbility();
  });
  document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{if(!canPay(s,{変:30}))return;pay(s,{変:30});p.br.push({t:b.dataset.n,lv:1});SFX.good();save();sucAbility()});
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{if(!canPay(s,spc))return;pay(s,spc);p.sp.push(b.dataset.s);SFX.good();save();sucAbility()});
  $("#bk").onclick=sucView;
}
function sucFinish(){
  const s=D.suc,p=s.pl,ov=sucOvr(s);
  let slot=s.type==="投手"?0:null;
  const draw=()=>{showMenu(`<div class="card"><h3>秋のプロテスト　結果発表</h3>
    <div class="msg" style="text-align:center">${p.n}の最終評価<br><span class="rk r${RK(ov)}" style="font-size:2rem;padding:4px 14px;margin-top:6px">${RK(ov)}</span></div>
    <div class="help">${s.type==="野手"?`${POSNAME[p.pos]}　弾道${p.traj} ミート${rk(p.meet)} パワー${rk(p.pow)} 走力${rk(p.spd)} 肩力${rk(p.arm)} 守備${rk(p.def)}`:`${p.kmh}km コントロール${rk(p.ctl)} スタミナ${rk(p.sta)} ${p.br.map(b=>b.t+b.lv).join(" ")}`}<br>${p.sp.map(x=>`<span class="sp">${x}</span>`).join("")}</div>
    <div class="msg"><span class="who">ミオ</span>「半年間、本当におつかれさま！<br>どのチームも${p.n}くんを欲しがってるよ。どこに入団する？」</div>
    ${s.type==="投手"?`<div class="lbl">役割</div><div class="grid2"><button class="opt${slot===0?" on":""}" data-r="0">先発</button><button class="opt${slot===1?" on":""}" data-r="1">抑え</button></div>`:""}
    <div class="lbl">入団するチーム</div>
    <div class="grid2">${BASE.map((b,i)=>{const t=teamData(i),rep=s.type==="野手"?t.bat.find(x=>x.pos===p.pos):t.pit[slot];return `<button class="opt" data-j="${i}" style="color:${b.c}">${b.n}<small>${rep?rep.n+"と入れ替え":""}</small></button>`}).join("")}</div></div>`);
    document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{slot=+b.dataset.r;draw()});
    document.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{
      const ti=+b.dataset.j,t=teamData(ti);D.mods[ti]=D.mods[ti]||{bat:{},pit:{}};
      if(s.type==="野手"){const idx=t.bat.findIndex(x=>x.pos===p.pos);D.mods[ti].bat[idx]={...p}}
      else D.mods[ti].pit[slot]={...p};
      D.mine.push({p:{...p},type:s.type,ovr:ov,team:ti});D.suc=null;save();SFX.hr();
      showMenu(`<div class="card"><h3>入団決定！</h3><div class="msg">${p.n}が${BASE[ti].n}に入団しました！<br>クイック対戦やペナントで${BASE[ti].n}を選ぶと、${p.n}が試合に出場します。</div>
        <button class="go" id="z">選手名鑑で見る</button><button class="back" id="m">メニューへ</button></div>`);
      $("#z").onclick=()=>zukan(ti);$("#m").onclick=mainMenu;
    });
  };draw();
}

// ================= 起動 =================
sndLabel();mainMenu();loop();
</script>
